name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # build-drift `git archive HEAD` çalıştırıyor
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tests/run.mjs
      # Kendi kendini denetler. Bir yayın denetleyicisinin kendi paketi
      # denetimden geçemiyorsa söyleyecek sözü kalmaz.
      - run: node src/cli.mjs .
